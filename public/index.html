<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <meta
      name="description"
      content="Contact Continental about Continental ID, Vanguard, Aegis, Blueprint, Continental Studios, and related projects."
    >
    <meta name="theme-color" content="#0b0d10">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:title" content="Contact Continental">
    <meta property="og:description" content="Get in touch about any Continental project.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://contact.continental-hub.com/">
    <title>Contact Continental</title>
    <link rel="canonical" href="https://contact.continental-hub.com/">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <link rel="alternate" type="application/json" href="/data.json" title="Site metadata">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Contact Continental",
        "url": "https://contact.continental-hub.com/",
        "description": "Shared project contact site for Continental projects.",
        "publisher": {
          "@type": "Organization",
          "name": "Continental",
          "url": "https://continental-hub.com"
        }
      }
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Site header">
        <a class="brand" href="/" aria-label="Contact Continental home">
          <img src="/assets/continental-mark.webp" alt="" width="42" height="42">
          <span>Continental</span>
        </a>
        <nav class="top-links" aria-label="Header links">
          <a href="https://continental-hub.com">Hub</a>
          <a href="https://status.continental-hub.com">Status</a>
        </nav>
      </header>

      <main class="main-layout">
        <section class="intro-panel" aria-labelledby="page-title">
          <div class="mark-wrap" aria-hidden="true">
            <img src="/assets/continental-mark.webp" alt="" width="94" height="94">
          </div>
          <p class="eyebrow">Shared project contact</p>
          <h1 id="page-title">Contact Continental</h1>
          <p class="subtitle">Get in touch about any Continental project.</p>

          <div class="globe-visual" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </section>

        <section class="form-card" aria-labelledby="form-title">
          <form id="contact-form" novalidate>
            <div class="form-heading">
              <h2 id="form-title">Send a message</h2>
            </div>

            <div class="form-row two-column">
              <div class="field">
                <label class="field-label" for="project">Project</label>
                <select id="project" name="project" required aria-describedby="project-error">
                  <option value="">Choose a project</option>
                  <option>General</option>
                  <option>Continental ID</option>
                  <option>Vanguard</option>
                  <option>Aegis</option>
                  <option>Blueprint</option>
                  <option>Continental Studios</option>
                  <option>Grimoire</option>
                  <option>StepCast</option>
                  <option>The Echo Archives</option>
                  <option>Minesweeper</option>
                  <option>Terra Tread</option>
                  <option>Sovereign</option>
                  <option>Other</option>
                </select>
                <p id="project-error" class="field-error"></p>
              </div>

              <div class="field">
                <label class="field-label" for="reason">Reason</label>
                <select id="reason" name="reason" required aria-describedby="reason-error reason-guidance">
                  <option value="">Choose a reason</option>
                  <option>Bug report</option>
                  <option>Feature request</option>
                  <option>Support/help</option>
                  <option>Security issue</option>
                  <option>Abuse report</option>
                  <option>Other</option>
                </select>
                <p id="reason-error" class="field-error"></p>
              </div>
            </div>

            <div id="reason-guidance" class="reason-guidance" hidden></div>

            <div class="field">
              <label class="field-label" for="email">Email <em>optional</em></label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                placeholder="you@example.com"
                aria-describedby="email-hint email-error"
              >
              <p id="email-hint" class="field-hint">For follow-up only.</p>
              <p id="email-error" class="field-error"></p>
            </div>

            <label class="hp-field" for="website" aria-hidden="true">
              <span>Website</span>
              <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
            </label>

            <div class="field">
              <label class="field-label" for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="8"
                maxlength="3000"
                required
                aria-describedby="message-hint message-error character-count"
                placeholder="Tell me what happened, what you need, or which idea you want to share."
              ></textarea>
              <p id="message-hint" class="field-hint">Links and timestamps help.</p>
              <p id="message-error" class="field-error"></p>
            </div>

            <div class="form-meta">
              <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
              <span id="character-count">0 / 3000</span>
            </div>

            <button class="submit-button" type="submit">
              <span class="button-label">Send message</span>
              <span class="button-loader" aria-hidden="true"></span>
            </button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <span>Continental Contact</span>
        <nav aria-label="Footer links">
          <a href="https://continental-hub.com">Continental Hub</a>
          <a href="https://status.continental-hub.com">Status</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
